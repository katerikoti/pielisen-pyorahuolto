<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hallintapaneeli – Pielisen Pyörähuolto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1E3A5F;--blue-light:#2a5080;--yellow:#F5C518;--yellow-dark:#d4a900;--gray:#f7f8fa;--text:#1a1a1a;--muted:#555;--border:#e2e6ea;--white:#fff;--red:#c0392b;--green:#1a7a4a}
body{font-family:system-ui,-apple-system,sans-serif;color:var(--text);font-size:16px;line-height:1.6;background:var(--gray);min-height:100vh}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.login-logo{font-size:1.1rem;font-weight:700;color:var(--blue);margin-bottom:.25rem}
.login-logo span{color:var(--yellow)}
.login-card h2{font-size:1.4rem;font-weight:800;margin-bottom:.4rem;color:var(--text)}
.login-card p{font-size:.88rem;color:var(--muted);margin-bottom:2rem}
.login-card input{width:100%;padding:.75rem 1rem;border:1px solid var(--border);border-radius:8px;font-size:1rem;margin-bottom:.75rem;outline:none;transition:border-color .2s}
.login-card input:focus{border-color:var(--blue)}
.login-card button{width:100%;background:var(--blue);color:var(--white);font-weight:700;font-size:1rem;padding:.8rem;border:none;border-radius:8px;cursor:pointer;transition:background .2s}
.login-card button:hover{background:var(--blue-light)}
.login-err{color:var(--red);font-size:.85rem;margin-top:.5rem;display:none}

/* APP */
#app{display:none}
header{background:var(--blue);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between}
.h-logo{color:var(--white);font-weight:700;font-size:1rem}
.h-logo span{color:var(--yellow)}
.h-right{display:flex;align-items:center;gap:1rem}
.h-site{color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem}
.h-site:hover{color:var(--yellow)}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);font-size:.82rem;padding:.35rem .85rem;border-radius:6px;cursor:pointer}
.btn-logout:hover{border-color:rgba(255,255,255,.6)}

main{max-width:820px;margin:0 auto;padding:2.5rem 1.5rem}

.panel{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.75rem;margin-bottom:1.5rem}
.panel-title{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}

label{display:block;font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:.35rem}
input[type=text],input[type=date],textarea{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s;color:var(--text)}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:100px;line-height:1.55}
.field{margin-bottom:1rem}

.form-row{display:flex;gap:1rem;flex-wrap:wrap}
.form-row .field{flex:1;min-width:180px}

.btn-post{background:var(--blue);color:var(--white);font-weight:700;padding:.75rem 1.75rem;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;transition:background .2s}
.btn-post:hover{background:var(--blue-light)}
.btn-post:disabled{opacity:.5;cursor:not-allowed}

.toast{position:fixed;bottom:2rem;right:2rem;background:var(--green);color:var(--white);padding:.75rem 1.25rem;border-radius:8px;font-size:.9rem;font-weight:600;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}

.posts-list{display:flex;flex-direction:column;gap:.75rem}
.post-item{border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;display:flex;align-items:flex-start;gap:1rem;background:var(--white)}
.post-item.hidden-post{background:var(--gray);border-style:dashed}
.post-meta{flex:1;min-width:0}
.post-title{font-weight:700;font-size:.97rem;color:var(--text);margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-date{font-size:.78rem;color:var(--muted)}
.post-body{font-size:.85rem;color:var(--muted);margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-actions{display:flex;gap:.5rem;flex-shrink:0;align-items:center}
.badge{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:12px;letter-spacing:.3px}
.badge-pub{background:#d4edda;color:#155724}
.badge-hid{background:#e2e3e5;color:#383d41}
.btn-sm{font-size:.8rem;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-weight:600;transition:all .2s;white-space:nowrap}
.btn-toggle{color:var(--blue);border-color:var(--blue)}
.btn-toggle:hover{background:var(--blue);color:var(--white)}
.btn-del{color:var(--red);border-color:transparent}
.btn-del:hover{background:#fdecea;border-color:#f5c6c6}

.empty-posts{color:var(--muted);font-size:.9rem;padding:.5rem 0}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-box{background:var(--gray);border-radius:10px;padding:1rem 1.25rem;text-align:center}
.stat-num{font-size:1.8rem;font-weight:800;color:var(--blue)}
.stat-lbl{font-size:.78rem;color:var(--muted);margin-top:.1rem}

@media(max-width:500px){
  header{padding:0 1.25rem}
  main{padding:1.5rem 1rem}
  .panel{padding:1.25rem}
  .stats-row{grid-template-columns:1fr 1fr}
  .post-actions{flex-direction:column;align-items:flex-end}
}

/* TABS */
.tab-bar{display:flex;gap:.5rem;margin-bottom:1.5rem}
.tab-btn{font-size:.92rem;font-weight:700;padding:.5rem 1.35rem;border:1.5px solid var(--border);border-radius:8px;background:var(--white);color:var(--muted);cursor:pointer;transition:all .15s}
.tab-btn:hover{border-color:var(--blue);color:var(--blue)}
.tab-btn.active{background:var(--blue);border-color:var(--blue);color:var(--white)}

/* BOOKINGS */
.bk-filter{font-size:.78rem;font-weight:600;padding:.3rem .85rem;border:1.5px solid var(--border);border-radius:20px;background:var(--white);color:var(--muted);cursor:pointer;transition:all .15s}
.bk-filter:hover{border-color:var(--blue);color:var(--blue)}
.bk-filter.active{background:var(--blue);border-color:var(--blue);color:var(--white)}
.bk-loading,.bk-empty{color:var(--muted);font-size:.9rem;padding:1.5rem 0}
/* BOOKINGS – calendar */
.cal-toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.cal-toolbar-left{display:flex;align-items:center;gap:.4rem;flex:1;min-width:0}
.cal-title{font-size:1.05rem;font-weight:800;white-space:nowrap}
.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
.view-btn{font-size:.8rem;font-weight:700;padding:.3rem .8rem;border:none;background:var(--white);color:var(--muted);cursor:pointer}
.view-btn.active{background:var(--blue);color:var(--white)}
.nav-btn{background:var(--white);border:1.5px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--text)}
.nav-btn:hover{border-color:var(--blue);color:var(--blue)}
.cal-period{font-size:.95rem;font-weight:700;min-width:160px;text-align:center}
.btn-add-bk{background:var(--blue);color:var(--white);border:none;border-radius:8px;font-size:.82rem;font-weight:700;padding:.45rem 1rem;cursor:pointer;white-space:nowrap}
.btn-add-bk:hover{background:var(--blue-light)}

/* Month grid */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.month-hdr{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:.35rem 0}
.month-cell{min-height:68px;border:1px solid var(--border);border-radius:6px;padding:.35rem .4rem;cursor:pointer;background:var(--white);transition:background .1s;position:relative}
.month-cell:hover{background:#eef3fa}
.month-cell.today{border-color:var(--blue);background:#eef3fa}
.month-cell.other-month{background:var(--gray);color:var(--muted)}
.month-cell.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(30,58,95,.15)}
.mc-num{font-size:.78rem;font-weight:700;margin-bottom:.25rem}
.mc-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin:1px}
.dot-asiakas{background:var(--blue)}
.dot-admin{background:var(--yellow-dark)}
.dot-esto{background:#aaa}

/* Week grid */
.week-wrap{overflow-x:auto}
.week-grid{display:grid;min-width:520px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wg-head{display:grid;grid-template-columns:60px repeat(6,1fr);background:var(--gray);border-bottom:1px solid var(--border)}
.wg-hdr{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:.4rem .2rem}
.wg-row{display:grid;grid-template-columns:60px repeat(6,1fr);border-bottom:1px solid #f0f0f0}
.wg-row:last-child{border-bottom:none}
.wg-time{font-size:.7rem;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:.25rem 0;border-right:1px solid #f0f0f0}
.wg-cell{min-height:36px;border-right:1px solid #f0f0f0;padding:2px;cursor:pointer;background:var(--white);overflow:hidden;min-width:0}
.wg-cell:last-child{border-right:none}
.wg-cell:hover{background:#eef3fa}
.wg-card{font-size:.68rem;border-radius:4px;padding:.15rem .3rem;margin-bottom:1px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.wgc-asiakas{background:#dbeafe;color:#1e3a5f}
.wgc-admin{background:#fef9c3;color:#713f12}
.wgc-esto{background:#e5e7eb;color:#374151}

/* Day detail panel */
.day-panel{margin-top:1.25rem;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:none}
.day-panel-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--gray);border-bottom:1px solid var(--border)}
.day-panel-title{font-weight:800;font-size:.97rem}
.day-panel-actions{display:flex;gap:.4rem}
.btn-dp{font-size:.78rem;font-weight:600;padding:.3rem .75rem;border-radius:6px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;white-space:nowrap}
.btn-dp:hover{border-color:var(--blue);color:var(--blue)}
.btn-dp-block{border-color:#aaa;color:var(--muted)}
.btn-dp-block:hover{border-color:#666;color:var(--text)}
.day-bk-list{padding:.6rem .75rem;display:flex;flex-direction:column;gap:.5rem}
.day-bk{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.day-bk-head{display:flex;align-items:center;gap:.5rem;padding:.45rem .65rem;background:var(--gray);flex-wrap:wrap}
.day-bk-time{font-weight:700;font-size:.88rem;color:var(--blue)}
.day-bk-name{font-weight:700;font-size:.88rem}
.day-bk-body{padding:.45rem .65rem;font-size:.82rem;line-height:1.6;color:var(--text)}
.day-bk-body a{color:var(--blue);text-decoration:none}
.day-bk-body a:hover{text-decoration:underline}
.day-bk-acts{padding:.4rem .65rem;display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;border-top:1px solid #f2f2f2}
.notify-wrap{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--muted);margin-left:auto}
.notify-wrap input{width:auto}
.bk-btn{font-size:.78rem;font-weight:600;padding:.28rem .7rem;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;transition:all .15s}
.bk-vahvista:hover{background:#d4edda;border-color:#c3e6cb;color:#155724}
.bk-valmis:hover{background:#cce5ff;border-color:#b8daff;color:#004085}
.bk-peru:hover{background:#fdecea;border-color:#f5c6c6;color:var(--red)}
.bk-palauta:hover{background:#fff3cd;border-color:#ffeeba;color:#856404}
.day-bk-esto .day-bk-head{background:#f3f4f6}
.day-bk-empty{color:var(--muted);font-size:.88rem;padding:.75rem .2rem}

/* Status badges (reused by calendar) */
.tl-uusi{display:inline-block;padding:.18rem .6rem;border-radius:10px;font-size:.74rem;font-weight:700;background:#fff3cd;color:#856404}
.tl-vahv{display:inline-block;padding:.18rem .6rem;border-radius:10px;font-size:.74rem;font-weight:700;background:#d4edda;color:#155724}
.tl-valmis{display:inline-block;padding:.18rem .6rem;border-radius:10px;font-size:.74rem;font-weight:700;background:#cce5ff;color:#004085}
.tl-per{display:inline-block;padding:.18rem .6rem;border-radius:10px;font-size:.74rem;font-weight:700;background:#e2e3e5;color:#383d41}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal-box{background:var(--white);border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;border-bottom:1px solid var(--border)}
.modal-title{font-weight:800;font-size:1rem}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:1.25rem}
.modal-footer{padding:.75rem 1.25rem 1.25rem;display:flex;gap:.5rem;justify-content:flex-end;border-top:1px solid var(--border)}
.modal-footer button{font-size:.9rem;font-weight:700;padding:.55rem 1.25rem;border-radius:8px;cursor:pointer}
.btn-cancel-m{background:var(--white);border:1.5px solid var(--border);color:var(--muted)}
.btn-cancel-m:hover{border-color:#aaa;color:var(--text)}
.btn-save-m{background:var(--blue);color:var(--white);border:none}
.btn-save-m:hover{background:var(--blue-light)}
.btn-save-m:disabled{opacity:.5;cursor:not-allowed}
.mf{margin-bottom:.85rem}
.mf label{display:block;font-size:.82rem;font-weight:700;margin-bottom:.3rem}
.mf input,.mf select,.mf textarea{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:7px;font-size:.9rem;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--blue)}
.mf textarea{resize:vertical;min-height:70px}
.mf-row{display:flex;gap:.75rem}
.mf-row .mf{flex:1;min-width:0}
.mf-check{display:flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:600;cursor:pointer}
.mf-check input{width:auto}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><span>Pielisen</span> Pyörähuolto</div>
    <h2>Hallintapaneeli</h2>
    <p>Kirjaudu sisään julkaistaksesi uutisia</p>
    <label for="un">Käyttäjätunnus</label>
    <input type="text" id="un" placeholder="admin" onkeydown="if(event.key==='Enter')login()">
    <label for="pw">Salasana</label>
    <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Kirjaudu sisään</button>
    <div class="login-err" id="login-err">Väärä tunnus tai salasana.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="h-logo"><span>Pielisen</span> Pyörähuolto - Hallinta</div>
    <div class="h-right">
      <a class="h-site" href="index.html" target="_blank">&#8599; Avaa sivusto</a>
      <button class="btn-logout" onclick="logout()">Kirjaudu ulos</button>
    </div>
  </header>

  <main>
    <div class="stats-row" id="stats-varaukset">
      <div class="stat-box"><div class="stat-num" id="bk-s-tuleva">0</div><div class="stat-lbl">Tulevia varauksia</div></div>
      <div class="stat-box"><div class="stat-num" id="bk-s-tana">0</div><div class="stat-lbl">Tänään</div></div>
      <div class="stat-box"><div class="stat-num" id="bk-s-valmis">0</div><div class="stat-lbl">Valmistuneet</div></div>
    </div>
    <div class="stats-row" id="stats-uutiset" style="display:none">
      <div class="stat-box"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Julkaisuja yhteensä</div></div>
      <div class="stat-box"><div class="stat-num" id="s-pub">0</div><div class="stat-lbl">Näkyvissä</div></div>
      <div class="stat-box"><div class="stat-num" id="s-hid">0</div><div class="stat-lbl">Piilotettu</div></div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('varaukset',this)">Varaukset</button>
      <button class="tab-btn" onclick="switchTab('uutiset',this)">Uutiset</button>
    </div>

    <div id="tab-varaukset" class="tab-panel">
      <div class="panel">
        <!-- Calendar toolbar -->
        <div class="cal-toolbar">
          <div class="cal-toolbar-left">
            <div class="view-toggle">
              <button class="view-btn active" id="btn-week" onclick="calSetView('week')">Viikko</button>
              <button class="view-btn" id="btn-month" onclick="calSetView('month')">Kuukausi</button>
            </div>
            <button class="nav-btn" onclick="calNav(-1)" title="Edellinen">&#8249;</button>
            <span class="cal-period" id="cal-period">—</span>
            <button class="nav-btn" onclick="calNav(1)" title="Seuraava">&#8250;</button>
            <button class="nav-btn" onclick="calGoToday()" title="Tänään" style="width:auto;padding:0 .6rem;font-size:.78rem;font-weight:700">Tänään</button>
          </div>
          <button class="btn-add-bk" onclick="openAddModal(null)">+ Lisää varaus</button>
        </div>

        <!-- Calendar body -->
        <div id="cal-body"></div>

        <!-- Day detail panel -->
        <div class="day-panel" id="day-panel">
          <div class="day-panel-head">
            <span class="day-panel-title" id="day-panel-title">—</span>
            <div class="day-panel-actions">
              <button class="btn-dp" onclick="openAddModal(calState.selectedDate)">+ Lisää varaus</button>
              <button class="btn-dp btn-dp-block" onclick="openBlockModal(calState.selectedDate)">Estä aika</button>
            </div>
          </div>
          <div class="day-bk-list" id="day-panel-list"></div>
        </div>
      </div>
    </div><!-- /tab-varaukset -->

    <div id="tab-uutiset" class="tab-panel" style="display:none">
    <div class="panel">
      <div class="panel-title">&#43; Uusi julkaisu</div>
      <div class="field"><label for="f-title">Otsikko</label><input type="text" id="f-title" placeholder="esim. Keväthuolto alkaa!"></div>
      <div class="field"><label for="f-body">Teksti</label><textarea id="f-body" placeholder="Kirjoita lyhyt tiedote tai uutinen tähän..."></textarea></div>
      <div class="form-row">
        <div class="field"><label for="f-date">Päivämäärä</label><input type="date" id="f-date"></div>
      </div>
      <button class="btn-post" onclick="addPost()">Julkaise uutinen</button>
    </div>

    <div class="panel">
      <div class="panel-title">Julkaisut</div>
      <div class="posts-list" id="posts-list"></div>
    </div>
    </div><!-- /tab-uutiset -->
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Add Booking Modal -->
<div class="modal-overlay" id="modal-add" style="display:none" onclick="if(event.target===this)closeModal('modal-add')">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">Lisää varaus</span>
      <button class="modal-close" onclick="closeModal('modal-add')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="mf-row">
        <div class="mf"><label>Päivämäärä*</label><input type="date" id="am-pvm" oninput="loadFreeSlots()"></div>
        <div class="mf"><label>Kellonaika*</label>
          <select id="am-aika"><option value="">Valitse päivä ensin</option></select>
        </div>
      </div>
      <div class="mf-row">
        <div class="mf"><label>Nimi*</label><input type="text" id="am-nimi" placeholder="Matti Meikäläinen"></div>
        <div class="mf"><label>Puhelin</label><input type="text" id="am-puhelin" placeholder="040 123 4567"></div>
      </div>
      <div class="mf"><label>Sähköposti*</label><input type="email" id="am-email" placeholder="asiakas@email.fi"></div>
      <div class="mf-row">
        <div class="mf"><label>Pyörätyyppi*</label>
          <select id="am-pyora">
            <option value="">Valitse...</option>
            <option value="tavallinen">Polkupyörä</option>
            <option value="sahkopyora">Sähköpyörä</option>
            <option value="lapsi">Lasten pyörä</option>
            <option value="muu">Muu</option>
          </select>
        </div>
        <div class="mf"><label>Palvelu*</label>
          <select id="am-palvelu">
            <option value="">Valitse...</option>
            <option value="perushuolto">Perushuolto</option>
            <option value="tayshuolto">Täyshuolto</option>
            <option value="sahko_huolto">Sähköpyörän huolto</option>
            <option value="rengaskorjaus">Rengaskorjaus</option>
            <option value="muu">Muu</option>
          </select>
        </div>
      </div>

<script>
const PW_HASH='a1d182d125869e9e5df6cff0f27f9d194e61793c90183ae0b5b86a0bc87ea4fc';
const USER_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
let posts=[];
const months=['tammikuuta','helmikuuta','maaliskuuta','huhtikuuta','toukokuuta','kesäkuuta','heinäkuuta','elokuuta','syyskuuta','lokakuuta','marraskuuta','joulukuuta'];

function fmtDate(d){const dt=new Date(d);return `${dt.getDate()}. ${months[dt.getMonth()]} ${dt.getFullYear()}`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

async function loadPosts(){
  try{
    const r=await fetch(`uutiset-api.php?token=${PW_HASH}`);
    const data=await r.json();
    posts=data.posts||[];
  }catch(e){posts=[];}
  renderPosts();
}

function updateStats(){
  const pub=posts.filter(p=>p.published).length;
  document.getElementById('s-total').textContent=posts.length;
  document.getElementById('s-pub').textContent=pub;
  document.getElementById('s-hid').textContent=posts.length-pub;
}

function renderPosts(){
  const el=document.getElementById('posts-list');
  const sorted=[...posts].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sorted.length){el.innerHTML='<p class="empty-posts">Ei julkaisuja vielä. Lisää ensimmäinen uutinen yllä.</p>';updateStats();return;}
  el.innerHTML=sorted.map(p=>`
    <div class="post-item ${p.published?'':'hidden-post'}" id="pi-${p.id}">
      <div class="post-meta">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.15rem">
          <span class="badge ${p.published?'badge-pub':'badge-hid'}">${p.published?'Näkyvissä':'Piilotettu'}</span>
          <span class="post-date">${fmtDate(p.date)}</span>
        </div>
        <div class="post-title">${esc(p.title)}</div>
        <div class="post-body">${esc(p.body)}</div>
      </div>
      <div class="post-actions">
        <button class="btn-sm btn-toggle" onclick="togglePost(${p.id})">${p.published?'Piilota':'Näytä'}</button>
        <button class="btn-sm btn-del" onclick="deletePost(${p.id})">Poista</button>
      </div>
    </div>
  `).join('');
  updateStats();
}

async function addPost(){
  const title=document.getElementById('f-title').value.trim();
  const body=document.getElementById('f-body').value.trim();
  const date=document.getElementById('f-date').value;
  if(!title){alert('Lisää otsikko.');return;}
  if(!body){alert('Lisää teksti.');return;}
  if(!date){alert('Valitse päivämäärä.');return;}
  const btn=document.querySelector('.btn-post');
  btn.disabled=true;
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','add');

  const r=await fetch('uutiset-api.php',{method:'POST',body:fd});

}

async function togglePost(id){
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','toggle');fd.append('id',id);

    showToast(data.published?'Julkaisu näkyy nyt sivustolla.':'Julkaisu piilotettu.');

  }
}

async function deletePost(id){
  if(!confirm('Haluatko varmasti poistaa tämän julkaisun? Tätä ei voi perua.'))return;
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','delete');fd.append('id',id);
  const r=await fetch('uutiset-api.php',{method:'POST',body:fd});
  const data=await r.json();
  if(data.ok){showToast('Julkaisu poistettu.');await loadPosts();}
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function login(){
  const u=document.getElementById('un').value;
  const v=document.getElementById('pw').value;
  const err=document.getElementById('login-err');
  const [uhash,phash]=await Promise.all([sha256(u),sha256(v)]);
  if(uhash===USER_HASH&&phash===PW_HASH){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    err.style.display='none';
    document.getElementById('f-date').valueAsDate=new Date();

}

/* ── Bookings ── */
const PALVELUT={perushuolto:'Perushuolto',tayshuolto:'Täyshuolto',sahko_huolto:'Sähköpyörän huolto',rengaskorjaus:'Rengaskorjaus',muu:'Muu'};
const PYORAT  ={tavallinen:'Polkupyörä',sahkopyora:'Sähköpyörä',lapsi:'Lasten pyörä',muu:'Muu'};
const TILAT   ={uusi:{l:'',c:''},vahvistettu:{l:'',c:''},valmis:{l:'Valmis',c:'tl-valmis'},peruttu:{l:'Peruttu',c:'tl-per'}};
const BK_KK   =['tammikuuta','helmikuuta','maaliskuuta','huhtikuuta','toukokuuta','kesäkuuta','heinäkuuta','elokuuta','syyskuuta','lokakuuta','marraskuuta','joulukuuta'];
const BK_KK_S =['Tam','Hel','Maa','Huh','Tou','Kes','Hei','Elo','Syy','Lok','Mar','Jou'];
const BK_DAYS =['Ma','Ti','Ke','To','Pe','La']; // Mon-Sat
const SLOTS_WEEKDAY=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
const SLOTS_SAT    =['10:00','11:00','12:00','13:00'];

function bkFmt(s){const[y,m,d]=s.split('-');return `${parseInt(d)}. ${BK_KK[parseInt(m)-1]} ${y}`;}
function bkFmtShort(s){const[y,m,d]=s.split('-');return `${parseInt(d)}.${parseInt(m)}.${y}`;}
function dateISO(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function todayISO(){const n=new Date();return dateISO(n.getFullYear(),n.getMonth(),n.getDate());}
function getSlotsForISO(iso){const d=new Date(iso+'T12:00:00');return d.getDay()===6?SLOTS_SAT:SLOTS_WEEKDAY;}

/* Calendar state */
const calState={
  view:'week',       // 'month' | 'week'
  year:0, month:0,   // for month view
  weekStart:null,    // Date (Monday) for week view
  bookings:[],
  selectedDate:null,
};

function calInit(){
  const n=new Date();
  calState.year=n.getFullYear();
  calState.month=n.getMonth();
  // compute monday of current week
  const wd=n.getDay()||7; // 1=Mon…7=Sun
  const mon=new Date(n);
  mon.setDate(n.getDate()-wd+1);
  calState.weekStart=mon;
  calLoadBookings();
}

function updateBkStats(bookings){
  const today=todayISO();
  const active=bookings.filter(b=>b.tila!=='peruttu'&&(b.tyyppi||'asiakas')!=='esto');
  document.getElementById('bk-s-tuleva').textContent=active.filter(b=>b.toivottu_pvm>=today).length;
  document.getElementById('bk-s-tana').textContent=active.filter(b=>b.toivottu_pvm===today).length;
  document.getElementById('bk-s-valmis').textContent=bookings.filter(b=>b.tila==='valmis').length;
}

function calLoadBookings(){
  fetch(`varaukset-api.php?token=${PW_HASH}&filter=kaikki`)
    .then(r=>r.json())
    .then(data=>{
      calState.bookings=data.bookings||[];
      updateBkStats(calState.bookings);
      calRender();
    })
    .catch(()=>{
      document.getElementById('cal-body').innerHTML=
        '<div class="bk-err">Palvelinta ei tavoitettu. Varmista, että sivu on PHP-palvelimella.</div>';
    });
}

function calRender(){
  if(calState.view==='month') renderMonth();
  else renderWeek();
}

/* ── Month view ── */
function renderMonth(){
  const {year,month}=calState;
  const fi_months=['Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu',
                   'Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'];
  document.getElementById('cal-period').textContent=`${fi_months[month]} ${year}`;

  // Build grid: weeks Mon-Sun
  const firstDay=new Date(year,month,1).getDay()||7; // 1=Mon
  const daysInMonth=new Date(year,month+1,0).getDate();
  const startOffset=firstDay-1; // cells before 1st

  let html='<div class="month-grid">';
  ['Ma','Ti','Ke','To','Pe','La','Su'].forEach(d=>{html+=`<div class="month-hdr">${d}</div>`;});

  const today=todayISO();
  // Map bookings by date
  const byDate={};
  for(const b of calState.bookings){
    if(!byDate[b.toivottu_pvm])byDate[b.toivottu_pvm]=[];
    byDate[b.toivottu_pvm].push(b);
  }

  // Prev month fill
  const prevDays=new Date(year,month,0).getDate();
  for(let i=startOffset;i>0;i--){
    const d=prevDays-i+1;
    const iso=dateISO(month===0?year-1:year,month===0?11:month-1,d);
    html+=`<div class="month-cell other-month" onclick="calSelectDay('${iso}')">${cellContent(iso,d,byDate)}</div>`;
  }
  // This month
  for(let d=1;d<=daysInMonth;d++){
    const iso=dateISO(year,month,d);
    const cls=['month-cell'];
    if(iso===today)cls.push('today');
    if(iso===calState.selectedDate)cls.push('selected');
    html+=`<div class="${cls.join(' ')}" onclick="calSelectDay('${iso}')">${cellContent(iso,d,byDate)}</div>`;
  }
  // Next month fill
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
  let nd=1;
  for(let i=startOffset+daysInMonth;i<totalCells;i++,nd++){
    const iso=dateISO(month===11?year+1:year,month===11?0:month+1,nd);
    html+=`<div class="month-cell other-month" onclick="calSelectDay('${iso}')">${cellContent(iso,nd,byDate)}</div>`;
  }
  html+='</div>';
  document.getElementById('cal-body').innerHTML=html;
  renderDayPanel();
}

function cellContent(iso,d,byDate){
  let html=`<div class="mc-num">${d}</div>`;
  const list=(byDate[iso]||[]).filter(b=>b.tila!=='peruttu');
  // Show up to 3 dots
  const shown=list.slice(0,3);
  if(shown.length){
    html+='<div>';
    shown.forEach(b=>{html+=`<span class="mc-dot dot-${b.tyyppi||'asiakas'}"></span>`;});
    if(list.length>3)html+=`<span style="font-size:.6rem;color:var(--muted)">+${list.length-3}</span>`;
    html+='</div>';
  }
  return html;
}

/* ── Week view ── */
function renderWeek(){
  const mon=calState.weekStart;
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  // Label: e.g. "28.4–3.5.2026"
  const label=`${mon.getDate()}.${mon.getMonth()+1}–${sun.getDate()}.${sun.getMonth()+1}.${sun.getFullYear()}`;
  document.getElementById('cal-period').textContent=label;

  // Build date array Mo–Sa (6 days, ignore Sun as closed)
  const dates=[];
  for(let i=0;i<6;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);dates.push(d);}

  // Map bookings by date+time
  const byDT={};
  for(const b of calState.bookings){
    const key=`${b.toivottu_pvm}|${b.toivottu_aika}`;
    if(!byDT[key])byDT[key]=[];
    byDT[key].push(b);
  }

  const today=todayISO();

  let html='<div class="week-wrap"><div class="week-grid">';
  // Header row
  html+='<div class="wg-head"><div class="wg-hdr"></div>';
  dates.forEach(d=>{
    const iso=dateISO(d.getFullYear(),d.getMonth(),d.getDate());
    const dayNames=['Su','Ma','Ti','Ke','To','Pe','La'];
    const isToday=iso===today?'style="color:var(--blue)"':'';
    html+=`<div class="wg-hdr" ${isToday}>${dayNames[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}</div>`;
  });
  html+='</div>';

  // All possible slots (union of weekday + sat)
  const allSlots=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
  allSlots.forEach(slot=>{
    html+=`<div class="wg-row"><div class="wg-time">${slot}</div>`;
    dates.forEach(d=>{
      const iso=dateISO(d.getFullYear(),d.getMonth(),d.getDate());
      const dow=d.getDay(); // 0=Sun
      // Is this slot valid for this day?
      const validSlots=dow===6?SLOTS_SAT:SLOTS_WEEKDAY;
      if(!validSlots.includes(slot)){
        html+=`<div class="wg-cell" style="background:#f9f9f9;cursor:default"></div>`;
        return;
      }
      const key=`${iso}|${slot}`;
      const bks=(byDT[key]||[]).filter(b=>b.tila!=='peruttu');
      let content='';
      bks.forEach(b=>{
        const t=b.tyyppi||'asiakas';
        const name=b.tyyppi==='esto'?(b.lisatiedot||'Estetty'):(b.nimi||'');
        content+=`<div class="wg-card wgc-${t}" title="${esc(name)}">${esc(name)}</div>`;
      });
      html+=`<div class="wg-cell" onclick="calSelectDay('${iso}')">${content}</div>`;
    });
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('cal-body').innerHTML=html;
  renderDayPanel();
}

/* ── Navigation ── */
function calSetView(v){
  calState.view=v;
  document.getElementById('btn-month').classList.toggle('active',v==='month');
  document.getElementById('btn-week').classList.toggle('active',v==='week');
  calRender();
}

function calNav(dir){
  if(calState.view==='month'){
    calState.month+=dir;
    if(calState.month>11){calState.month=0;calState.year++;}
    if(calState.month<0){calState.month=11;calState.year--;}
  } else {
    calState.weekStart=new Date(calState.weekStart);
    calState.weekStart.setDate(calState.weekStart.getDate()+dir*7);
  }
  calRender();
}

function calGoToday(){
  const n=new Date();
  calState.year=n.getFullYear();
  calState.month=n.getMonth();
  const wd=n.getDay()||7;
  const mon=new Date(n);mon.setDate(n.getDate()-wd+1);
  calState.weekStart=mon;
  calRender();
}

function calSelectDay(iso){
  calState.selectedDate=iso;
  calRender();
}

/* ── Day detail panel ── */
function renderDayPanel(){
  const iso=calState.selectedDate;
  const panel=document.getElementById('day-panel');
  if(!iso){panel.style.display='none';return;}
  panel.style.display='block';
  document.getElementById('day-panel-title').textContent=bkFmt(iso);

  const list=calState.bookings.filter(b=>b.toivottu_pvm===iso)
    .sort((a,b)=>a.toivottu_aika.localeCompare(b.toivottu_aika));

  const el=document.getElementById('day-panel-list');
  if(!list.length){el.innerHTML='<p class="day-bk-empty">Ei varauksia tälle päivälle.</p>';return;}

  el.innerHTML=list.map(b=>{
    const t=TILAT[b.tila]||{l:b.tila,c:''};
    const tyyppi=b.tyyppi||'asiakas';
    const isEsto=tyyppi==='esto';
    const acts=[];
    if(!isEsto){
      if(b.tila!=='valmis'&&b.tila!=='peruttu')
        acts.push(`<button class="bk-btn bk-valmis" onclick="updateBk(${b.id},'valmis')">Valmis</button>`);
    }
    if(b.tila!=='peruttu')
      acts.push(`<button class="bk-btn bk-peru" onclick="peruBk(${b.id},'${esc(b.tyyppi||'asiakas')}')">Peru</button>`);
    if(b.tila==='peruttu'||b.tila==='valmis')
      acts.push(`<button class="bk-btn bk-palauta" onclick="updateBk(${b.id},'uusi')">Palauta</button>`);

    const notifyChk=(!isEsto&&b.tila!=='peruttu'&&b.email)?
      `<label class="notify-wrap"><input type="checkbox" id="notify-${b.id}" checked> Ilmoita asiakkaalle</label>`:'';

    const extra=b.lisatiedot?`<div style="color:var(--muted)">${esc(b.lisatiedot)}</div>`:'';
    const serviceRow=isEsto
      ?`<div style="color:var(--muted)">Estetty aika${b.lisatiedot?': '+esc(b.lisatiedot):''}</div>`
      :`<div>${esc(PALVELUT[b.palvelu]||b.palvelu)} &middot; ${esc(PYORAT[b.pyora_tyyppi]||b.pyora_tyyppi)}</div>${extra}`;

    return `<div class="day-bk${isEsto?' day-bk-esto':''}">
  <div class="day-bk-head">
    <span class="day-bk-time">klo ${esc(b.toivottu_aika)}</span>
    ${!isEsto?`<span class="day-bk-name">${esc(b.nimi)}</span>`:'<span class="day-bk-name" style="color:#666">Estetty</span>'}
    ${t.l?`<span class="${t.c}">${t.l}</span>`:''}
    ${tyyppi==='admin'?'<span style="font-size:.7rem;color:#888">(puhelin)</span>':''}
  </div>
  ${!isEsto?`<div class="day-bk-body">
    <a href="tel:${esc(b.puhelin)}">${esc(b.puhelin)}</a>
    ${b.email?` &middot; <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`:''}
    ${serviceRow}
  </div>`:`<div class="day-bk-body">${serviceRow}</div>`}
  <div class="day-bk-acts">${acts.join('')}${notifyChk}</div>
</div>`;
  }).join('');
}

  fd.append('token',PW_HASH);fd.append('action','update');
  fd.append('id',id);fd.append('tila',tila);
  fetch('varaukset-api.php',{method:'POST',body:fd})

function peruBk(id, tyyppi){
  const notifyEl=document.getElementById(`notify-${id}`);
  const notify=(tyyppi==='asiakas'&&notifyEl&&notifyEl.checked)?1:0;
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','update');
  fd.append('id',id);fd.append('tila','peruttu');
  if(notify)fd.append('notify','1');
  fetch('varaukset-api.php',{method:'POST',body:fd})
    .then(r=>r.json())
    .then(d=>{
      if(d.ok){showToast(notify?'Varaus peruttu, ilmoitus lähetetty.':'Varaus peruttu.');calLoadBookings();}
      else showToast('Virhe päivityksessä.');

  m.style.display='flex';
}

function openBlockModal(dateISO){
  const m=document.getElementById('modal-block');
  document.getElementById('bm-pvm').value=dateISO||'';
  document.getElementById('bm-aika').innerHTML='<option value="">Valitse aika...</option>';
  document.getElementById('bm-koko').checked=false;
  document.getElementById('bm-syy').value='';
  document.getElementById('bm-aika-wrap').style.display='block';
  if(dateISO)loadBlockSlots();
  m.style.display='flex';
}

function toggleKokoPaiva(){
  const koko=document.getElementById('bm-koko').checked;
  document.getElementById('bm-aika-wrap').style.display=koko?'none':'block';
}

async function loadFreeSlots(){
  const pvm=document.getElementById('am-pvm').value;
  const sel=document.getElementById('am-aika');
  if(!pvm){sel.innerHTML='<option value="">Valitse päivä ensin</option>';return;}
  sel.innerHTML='<option value="">Ladataan...</option>';
  try{
    const r=await fetch(`slots.php?date=${pvm}`);
    const data=await r.json();
    const booked=data.booked||[];
    const slots=getSlotsForISO(pvm);
    const opts=slots.filter(s=>!booked.includes(s))
      .map(s=>`<option value="${s}">${s}</option>`).join('');
    sel.innerHTML=opts||'<option value="">Ei vapaita aikoja</option>';
  }catch(e){sel.innerHTML='<option value="">Virhe ladattaessa</option>';}
}

async function loadBlockSlots(){
  const pvm=document.getElementById('bm-pvm').value;
  const sel=document.getElementById('bm-aika');
  if(!pvm){sel.innerHTML='<option value="">Valitse päivä ensin</option>';return;}
  sel.innerHTML='<option value="">Ladataan...</option>';
  try{
    const slots=getSlotsForISO(pvm);
    sel.innerHTML='<option value="">Valitse aika...</option>'+
      slots.map(s=>`<option value="${s}">${s}</option>`).join('');
  }catch(e){sel.innerHTML='<option value="">Virhe</option>';}
}

async function submitAddBooking(){
  const pvm   =document.getElementById('am-pvm').value;
  const aika  =document.getElementById('am-aika').value;
  const nimi  =document.getElementById('am-nimi').value.trim();
  const puh   =document.getElementById('am-puhelin').value.trim();
  const email =document.getElementById('am-email').value.trim();
  const pyora =document.getElementById('am-pyora').value;
  const palvelu=document.getElementById('am-palvelu').value;
  const lisatiedot=document.getElementById('am-lisatiedot').value.trim();
  if(!pvm||!aika){showToast('Valitse päivämäärä ja aika.');return;}
  if(!nimi||!email){showToast('Täytä vähintään nimi ja sähköposti.');return;}
  if(!pyora||!palvelu){showToast('Valitse pyörätyyppi ja palvelu.');return;}
  const btn=document.getElementById('am-save');
  btn.disabled=true;
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','add');fd.append('tyyppi','admin');
  fd.append('toivottu_pvm',pvm);fd.append('toivottu_aika',aika);
  fd.append('nimi',nimi);fd.append('puhelin',puh);fd.append('email',email);
  fd.append('pyora_tyyppi',pyora);fd.append('palvelu',palvelu);fd.append('lisatiedot',lisatiedot);
  const r=await fetch('varaukset-api.php',{method:'POST',body:fd});
  const data=await r.json();
  btn.disabled=false;
  if(data.ok){
    closeModal('modal-add');
    showToast('Varaus lisätty!');
    calState.selectedDate=pvm;
    calLoadBookings();
  }else showToast('Virhe tallennuksessa.');
}

async function submitBlock(){
  const pvm =document.getElementById('bm-pvm').value;
  const aika=document.getElementById('bm-aika').value;
  const koko=document.getElementById('bm-koko').checked;
  const syy =document.getElementById('bm-syy').value.trim();
  if(!pvm){showToast('Valitse päivämäärä.');return;}
  if(!koko&&!aika){showToast('Valitse kellonaika tai estä koko päivä.');return;}
  const btn=document.getElementById('bm-save');
  btn.disabled=true;
  const fd=new FormData();
  fd.append('token',PW_HASH);fd.append('action','add');fd.append('tyyppi','esto');
  fd.append('toivottu_pvm',pvm);
  if(!koko)fd.append('toivottu_aika',aika);
  if(koko)fd.append('koko_paiva','1');
  fd.append('lisatiedot',syy);
  const r=await fetch('varaukset-api.php',{method:'POST',body:fd});
  const data=await r.json();
  btn.disabled=false;
  if(data.ok){
    closeModal('modal-block');
    showToast(koko?'Koko päivä estetty!':'Aika estetty!');
    calState.selectedDate=pvm;
    calLoadBookings();
  }else showToast('Virhe tallennuksessa.');
}

function loadBookings(){calInit();}  // legacy alias called on login
</script>
